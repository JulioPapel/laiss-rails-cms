name: CI

# The gate for laiss-rails-cms. Four independent jobs:
#
#   ruby       the specs, across the supported Ruby/Rails range
#   javascript lint, build and the vitest suite
#   leak-scan  the rebrand promise: no upstream name outside the LICENSE files
#   scratch    an app with no asset pipeline gets a named boot error
#
# EVERY JOB CALLS script/gates. There is one implementation of the checks, and CI
# runs it rather than a copy of its commands. That is not tidiness: CI used to call
# `bundle exec rspec devise/spec` directly from the root, which loaded the core spec
# helper and left the devise integration inactive, while `script/gates` passed
# because it goes through bin/rspec. Two entry points meant one was broken and
# nobody could tell.
#
# The example-count floors lived in a separate `counts` job with hardcoded numbers
# (4419/851) that had gone stale against the real figures (4410/846), so that job
# would have failed on every run. script/gates already enforces the floors from
# BASELINE_* constants, so the job was redundant as well as wrong and was removed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded branch runs so a PR does not queue behind stale pushes.
  # Never cancel main, so a release commit always finishes.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep this aligned with the pinned development version in .ruby-version.
  BUNDLE_JOBS: 4

jobs:
  # ---------------------------------------------------------------------------
  # Specs. The gemspec requires ruby >= 3.4 and rails >= 7.2, < 8.2. Every leg here
  # is a combination this project claims to support, so every leg must be one we
  # can actually run.
  #
  # The old matrix had a 3.1 / 7.2 leg, which was a claim with no evidence behind
  # it: Ruby 3.1 was never exercised on any machine, and the requirement has been
  # narrowed to 3.4 to match what is tested. Dropping the leg rather than keeping a
  # red one is the honest move — a requirement wider than the evidence is a promise
  # the maintainers cannot keep.
  # ---------------------------------------------------------------------------
  ruby:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor of the supported range (gemspec: ruby >= 3.4), paired with the
          # Rails floor. This is the oldest combination that is claimed and tested.
          - ruby: "3.4"
            rails: "7.2"
          # The same Ruby with the newest supported Rails: the combination most
          # host apps run today.
          - ruby: "3.4"
            rails: "8.1"
          # The pinned development version from .ruby-version / .tool-versions.
          - ruby: "4.0.6"
            rails: "8.1"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The built assets are committed, but a clean checkout of a PR may not have
      # them, and the specs render the admin.
      - name: Dependencies and assets
        run: |
          pnpm install --frozen-lockfile
          bundle install
          pnpm run build

      # Runs the same implementation contributors run locally, rather than a copy
      # of the commands. CI used to call `bundle exec rspec devise/spec` directly
      # from the root, which loaded the CORE spec helper (a load-path lookup hits
      # ./spec first) and left the devise integration inactive — 5 spec files died
      # with "uninitialized constant LaissCms::Devise" while `script/gates` passed,
      # because that goes through bin/rspec, which cd's into each lib.
      #
      # One implementation, so the two entry points cannot disagree again.
      - name: Gates (ruby)
        env:
          RAILS_ENV: test
          RAILS_VERSION: ${{ matrix.rails }}
        run: script/gates ruby

  # ---------------------------------------------------------------------------
  # JavaScript: lint, build, component tests, and the committed-artifact check.
  #
  # Calls script/gates rather than repeating the commands. The vitest floor lives
  # there too, so this job and the local run cannot disagree.
  # ---------------------------------------------------------------------------
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Gates (js)
        run: |
          bundle install
          script/gates js

  # ---------------------------------------------------------------------------
  # The rebrand promise. This is a PUBLIC statement about how this project relates
  # to the software it derives from:
  #
  #   The derivation is disclosed in LICENSE, because the BSD-3-Clause licence
  #   requires the copyright notice to be retained. It is disclosed NOWHERE ELSE:
  #   not in the source, not in the docs, not in a comment, not in a commit
  #   message. Anyone reading this repository sees a project called
  #   laiss-rails-cms that carries its upstream attribution in the one file where
  #   the licence demands it.
  #
  # Both scripts exit non-zero on a violation, so this job fails the build rather
  # than warning.
  # ---------------------------------------------------------------------------
  leak-scan:
    name: Rebrand guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      - name: Gates (rebrand)
        run: script/gates rebrand

  # ---------------------------------------------------------------------------
  # The scratch-app gate: the one check that cannot run against the dummy app.
  #
  # The dummy has propshaft, which is exactly how 0.1.0.beta2 shipped an admin that
  # 500'd on every page in an app without an asset pipeline. This builds a
  # throwaway app and asserts the engine refuses to boot with a named error.
  #
  # Separate job because it needs a plain `rails` executable, not `bundle exec
  # rails` (which refuses to run inside another Rails app).
  # ---------------------------------------------------------------------------
  scratch:
    name: Scratch app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      - name: Gates (scratch)
        run: |
          bundle install
          script/gates scratch
