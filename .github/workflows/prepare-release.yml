name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type. Choose "release" for finalizing a pre-release, or patch/minor/major to bump version.'
        required: true
        type: choice
        default: 'patch'
        options:
          - release
          - patch
          - minor
          - major

jobs:
  prepare:
    uses: LaissCMS/.github/.github/workflows/prepare-release.yml@main
    with:
      version_file_path: lib/laiss_cms/version.rb
      bump: ${{ inputs.bump }}
    secrets:
      app_id: ${{ vars.LAISS_CMS_BOT_APP_ID }}
      app_private_key: ${{ secrets.LAISS_CMS_BOT_APP_PRIVATE_KEY }}
