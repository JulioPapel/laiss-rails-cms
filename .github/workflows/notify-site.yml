# Tells railscms.laiss.pt to rebuild its documentation when this repository's
# guides change. The site renders this repository's markdown at build time, so
# without this the published docs only refresh on the site's daily schedule.
#
# It fires on exactly two occasions: a green main, and a tag push. Deliberately
# not on every push as well, because a green main already implies a push and the
# notification would be sent twice.
#
# One repository secret is required here, not on the site:
#
#   SITE_DISPATCH_TOKEN
#     A fine-grained personal access token (or GitHub App installation token)
#     with "Contents: read and write" on JulioPapel/site-laiss-rails-cms.
#     Nothing else. It cannot read this repository's secrets, and the site
#     repository never sees it.
#
# "Contents: write" is what GitHub requires to create a repository_dispatch
# event on another repository. "Metadata: read" is granted automatically.
#
# If the secret is absent the job succeeds with a notice instead of failing, so
# a fresh clone does not show a red check before the secret is configured.

name: Notify the site

on:
  # A green main. `workflow_run` fires when the named workflow finishes on main;
  # the job below checks it succeeded, so a red main never republishes the docs.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # A tag push publishes that exact tag, whether or not CI has caught up yet.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      cms_ref:
        description: "Ref to publish (tag, branch or commit SHA). Empty = this branch's commit."
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Tell railscms.laiss.pt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip a failed or cancelled CI run on main. Tag pushes and manual runs have
    # no workflow_run payload, so they pass.
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check the token secret exists
        id: guard
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site dispatch skipped::SITE_DISPATCH_TOKEN is not set on this repository. See the site's coolify.md, section 5."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the ref to publish
        id: ref
        env:
          INPUT_REF: ${{ inputs.cms_ref }}
        run: |
          # Precedence: an explicit manual input, then the tag being pushed, then
          # the commit that triggered this run. The site builds exactly this ref,
          # so it documents what was announced rather than whatever main happens
          # to be by the time it builds.
          if [ -n "${INPUT_REF}" ]; then
            ref="${INPUT_REF}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ref="${GITHUB_REF_NAME}"
          else
            ref="${GITHUB_SHA}"
          fi
          echo "cms_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Publishing documentation for: ${ref}"

      - name: Dispatch cms-docs-updated to the site
        if: steps.guard.outputs.configured == 'true'
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          CMS_REF_VALUE: ${{ steps.ref.outputs.cms_ref }}
          SITE_REPO: JulioPapel/site-laiss-rails-cms
        run: |
          set -euo pipefail

          status="$(
            curl --silent --show-error \
                 --output /dev/null \
                 --write-out '%{http_code}' \
                 --max-time 30 \
                 --retry 3 --retry-delay 5 --retry-connrefused \
                 -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer ${TOKEN}" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "https://api.github.com/repos/${SITE_REPO}/dispatches" \
                 -d "{\"event_type\":\"cms-docs-updated\",\"client_payload\":{\"cms_ref\":\"${CMS_REF_VALUE}\",\"cms_repo\":\"${GITHUB_REPOSITORY}\"}}"
          )"

          if [ "$status" != "204" ]; then
            echo "::error title=Dispatch failed::GitHub returned HTTP ${status} for ${SITE_REPO}."
            echo "The token may be expired, or may lack Contents: write on the site repository." >&2
            exit 1
          fi

          echo "Dispatched cms-docs-updated to ${SITE_REPO} with ref ${CMS_REF_VALUE}."
