---
engines:
  brakeman:
    enabled: false
  csslint:
    enabled: false
  coffeelint:
    enabled: false
  duplication:
    enabled: true
    exclude_paths:
      - "lib/laiss_cms/permissions.rb"
      - "lib/laiss_cms/tasks/tidy.rb"
      - "lib/tasks/laiss_cms/upgrade.rake"
    config:
      languages:
        - ruby
  eslint:
    enabled: false
  fixme:
    enabled: false
  rubocop:
    enabled: false
ratings:
  paths:
    - Gemfile.lock
    - "**.erb"
    - "**.rb"
exclude_paths:
  - "config/"
  - "db/"
  - "spec/"
  - "lib/laiss_cms/upgrader/"
  - "lib/rails/"
  - "vendor/assets/"
