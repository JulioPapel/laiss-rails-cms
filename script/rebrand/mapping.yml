# Canonical naming table for the laiss-rails-cms rebrand.
#
# This file is the SINGLE SOURCE OF TRUTH for every replacement. `apply` and
# `verify` both read it, so a token can never be renamed in one place and
# forgotten in the other.
#
# Row order is significant: rows are applied in the order given, and `apply`
# additionally sorts by descending pattern length so the most specific token
# always wins (AlchemyCMS before Alchemy, Alchemy:: before Alchemy).
#
# Keys per row:
#   id        stable identifier, used in reports and error messages
#   from      upstream token, matched literally (no regex metacharacters)
#   to        replacement token
#   mode      "word"  -> must not be flanked by [A-Za-z0-9_]  (identifiers, constants)
#             "prefix" -> must not be preceded by [A-Za-z0-9_]; may be followed by more
#                         identifier characters (snake/kebab asset prefixes)
#             "literal" -> plain substring match, no boundaries at all
#   kind      what the token is, so verify can explain a hit
#   expect    optional expected replacement casing for drift detection

# --- 1. Whole-product names (longest first) ---------------------------------
- id: alchemy_cms_brand
  from: AlchemyCMS
  to: LaissCMS
  mode: word
  kind: brand
  expect: LaissCMS

- id: alchemy_i18n_const
  from: AlchemyI18n
  to: LaissCmsI18n
  mode: word
  kind: constant
  expect: LaissCmsI18n

- id: alchemy_devise_const
  from: Alchemy::Devise
  to: LaissCms::Devise
  mode: literal
  kind: constant
  expect: LaissCms::Devise

# --- 2. Namespaces ----------------------------------------------------------
- id: alchemy_const_qualified
  from: "Alchemy::"
  to: "LaissCms::"
  mode: literal
  kind: constant
  expect: "LaissCms::"

# Compound CamelCase constants. The bare `Alchemy` row cannot match these: the
# following character is an uppercase letter, so there is no word boundary, and
# the row is deliberately boundary-anchored so it does not eat identifiers it
# does not own. Each is listed explicitly rather than loosening that rule.
# Found by loading the renamed suite, which failed on
# `uninitialized constant LaissCms::UpdateChecks::AlchemyApp`.
- id: alchemy_app_class
  from: AlchemyApp
  to: LaissCmsApp
  mode: word
  kind: constant
  expect: LaissCmsApp

- id: alchemy_six_point_one_class
  from: AlchemySixPointOne
  to: LaissCmsSixPointOne
  mode: word
  kind: constant
  expect: LaissCmsSixPointOne

# JavaScript custom-element backing classes: the JS mirror of the `alchemy-*`
# tag prefix. They live in app/javascript and are asserted by the vitest suite.
- id: alchemy_js_page_node
  from: AlchemyPageNode
  to: LaissCmsPageNode
  mode: word
  kind: constant
  expect: LaissCmsPageNode

- id: alchemy_js_node_tree
  from: AlchemyNodeTree
  to: LaissCmsNodeTree
  mode: word
  kind: constant
  expect: LaissCmsNodeTree

- id: alchemy_js_node_folder
  from: AlchemyNodeFolder
  to: LaissCmsNodeFolder
  mode: word
  kind: constant
  expect: LaissCmsNodeFolder

- id: alchemy_js_menu_node
  from: AlchemyMenuNode
  to: LaissCmsMenuNode
  mode: word
  kind: constant
  expect: LaissCmsMenuNode

- id: alchemy_js_sitemap
  from: AlchemySitemap
  to: LaissCmsSitemap
  mode: word
  kind: constant
  expect: LaissCmsSitemap

# Possessive form. `Alchemy` + "s" has no word boundary, so the bare-constant
# rule skips it and it survives as "Alchemys" in prose and comments. Listed
# explicitly rather than loosening the boundary rule.
- id: alchemy_possessive
  from: Alchemys
  to: LaissCMS's
  mode: word
  kind: brand
  expect: "LaissCMS's"

- id: alchemy_const_bare
  from: Alchemy
  to: LaissCms
  mode: word
  kind: constant
  expect: LaissCms

# `Alchemy` embedded inside a CamelCase identifier: migration and other class
# names such as `AddSearchableToAlchemyPages`, `CreateAlchemyUsers`,
# `AddAlchemyRolesToAlchemyUsers`. A boundary rule cannot match these (letter
# before, uppercase after), and enumerating them individually does not scale as
# new migrations arrive, so this rule handles the shape in general. It cannot
# touch snake_case (`current_alchemy_user`): there the token is lowercase and is
# never followed by an uppercase letter.
- id: alchemy_const_embedded
  from: Alchemy
  to: LaissCms
  mode: embedded
  kind: constant
  expect: LaissCms

# DOM data-attribute contracts, camelCase side.
#
# The ERB writes `data-alchemy-element="7"`; the JS reads
# `element.dataset.alchemyElement`. Renaming only the ERB side would leave the
# JS reading a key that no longer exists, silently breaking the live preview and
# the hotkey handler with no test failure. These two rows exist to keep both
# sides of that contract in step: `data-laiss-cms-element` maps to
# `dataset.laissCmsElement`.
- id: alchemy_dataset_element
  from: alchemyElement
  to: laissCmsElement
  mode: word
  kind: identifier
  expect: laissCmsElement

- id: alchemy_dataset_hotkey
  from: alchemyHotkey
  to: laissCmsHotkey
  mode: word
  kind: identifier
  expect: laissCmsHotkey

# --- 3. Gem names and snake identifiers -------------------------------------
- id: alchemy_cms_gem
  from: alchemy_cms
  to: laiss_cms
  mode: word
  kind: identifier
  expect: laiss_cms

- id: alchemy_i18n_gem
  from: alchemy_i18n
  to: laiss_cms_i18n
  mode: word
  kind: identifier
  expect: laiss_cms_i18n

- id: alchemy_devise_gem
  from: alchemy-devise
  to: laiss-cms-devise
  mode: word
  kind: identifier
  expect: laiss-cms-devise

- id: alchemy_admin_bundle
  from: alchemy_admin
  to: laiss_cms_admin
  mode: word
  kind: identifier
  expect: laiss_cms_admin

# --- 4. Asset / CSS / custom-element prefixes -------------------------------
- id: alchemy_kebab_prefix
  from: alchemy-
  to: laiss-cms-
  mode: prefix
  kind: asset
  expect: laiss-cms-

- id: alchemy_snake_prefix
  from: alchemy_
  to: laiss_cms_
  mode: prefix
  kind: identifier
  expect: laiss_cms_

# Migration filenames carry the token after a timestamp underscore:
# `20230121212637_alchemy_six_point_one.rb`. Rails derives the migration class
# from the post-timestamp name, so the file must be renamed in step with the
# class or `db:migrate` raises `uninitialized constant`. The "prefix" rule
# cannot match here because that position precedes an identifier character, so
# this row exists only for path segments (see Rebrand.transform_segment).
- id: alchemy_filename_prefix
  from: alchemy_
  to: laiss_cms_
  mode: filename
  kind: filename
  expect: laiss_cms_

# Compound snake_case identifiers, where `alchemy_` follows another underscore:
# `alchemy_elements_alchemy_pages` (the elements/pages join table),
# `index_alchemy_pages_on_lft` (index names Rails generates), and
# `user_alchemy_roles` (a column on the host's users table). The anchored
# "prefix" rule cannot see these because the preceding character is `_`.
#
# This is the only rule with no anchoring at all, so it is deliberately last:
# the anchored rules rewrite every ordinary leading `alchemy_` first, and this
# catches what remains inside a larger identifier.
- id: alchemy_inner_snake
  from: alchemy_
  to: laiss_cms_
  mode: literal
  kind: identifier
  expect: laiss_cms_

# --- 5. Environment variables ----------------------------------------------
# The two-token form must run before the generic prefix, otherwise
# ALCHEMY_CMS_PATH becomes LAISS_CMS_CMS_PATH (the "cms" appears twice).
- id: alchemy_cms_env
  from: ALCHEMY_CMS_
  to: LAISS_CMS_
  mode: prefix
  kind: env
  expect: LAISS_CMS_

- id: alchemy_env_prefix
  from: ALCHEMY_
  to: LAISS_CMS_
  mode: prefix
  kind: env
  expect: LAISS_CMS_

# --- 6. Last resort: bare lowercase word -----------------------------------
- id: alchemy_word
  from: alchemy
  to: laiss_cms
  mode: word
  kind: identifier
  expect: laiss_cms
