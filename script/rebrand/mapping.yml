# Canonical naming table for the laiss-rails-cms rebrand.
#
# This file is the SINGLE SOURCE OF TRUTH for every replacement. `apply` and
# `verify` both read it, so a token can never be renamed in one place and
# forgotten in the other.
#
# Row order is significant: rows are applied in the order given, and `apply`
# additionally sorts by descending pattern length so the most specific token
# always wins (AlchemyCMS before Alchemy, Alchemy:: before Alchemy).
#
# Keys per row:
#   id        stable identifier, used in reports and error messages
#   from      upstream token, matched literally (no regex metacharacters)
#   to        replacement token
#   mode      "word"  -> must not be flanked by [A-Za-z0-9_]  (identifiers, constants)
#             "prefix" -> must not be preceded by [A-Za-z0-9_]; may be followed by more
#                         identifier characters (snake/kebab asset prefixes)
#             "literal" -> plain substring match, no boundaries at all
#   kind      what the token is, so verify can explain a hit
#   expect    optional expected replacement casing for drift detection

# --- 1. Whole-product names (longest first) ---------------------------------
- id: alchemy_cms_brand
  from: AlchemyCMS
  to: LaissCMS
  mode: word
  kind: brand
  expect: LaissCMS

- id: alchemy_i18n_const
  from: AlchemyI18n
  to: LaissCmsI18n
  mode: word
  kind: constant
  expect: LaissCmsI18n

- id: alchemy_devise_const
  from: Alchemy::Devise
  to: LaissCms::Devise
  mode: literal
  kind: constant
  expect: LaissCms::Devise

# --- 2. Namespaces ----------------------------------------------------------
- id: alchemy_const_qualified
  from: "Alchemy::"
  to: "LaissCms::"
  mode: literal
  kind: constant
  expect: "LaissCms::"

- id: alchemy_const_bare
  from: Alchemy
  to: LaissCms
  mode: word
  kind: constant
  expect: LaissCms

# --- 3. Gem names and snake identifiers -------------------------------------
- id: alchemy_cms_gem
  from: alchemy_cms
  to: laiss_cms
  mode: word
  kind: identifier
  expect: laiss_cms

- id: alchemy_i18n_gem
  from: alchemy_i18n
  to: laiss_cms_i18n
  mode: word
  kind: identifier
  expect: laiss_cms_i18n

- id: alchemy_devise_gem
  from: alchemy-devise
  to: laiss-cms-devise
  mode: word
  kind: identifier
  expect: laiss-cms-devise

- id: alchemy_admin_bundle
  from: alchemy_admin
  to: laiss_cms_admin
  mode: word
  kind: identifier
  expect: laiss_cms_admin

# --- 4. Asset / CSS / custom-element prefixes -------------------------------
- id: alchemy_kebab_prefix
  from: alchemy-
  to: laiss-cms-
  mode: prefix
  kind: asset
  expect: laiss-cms-

- id: alchemy_snake_prefix
  from: alchemy_
  to: laiss_cms_
  mode: prefix
  kind: identifier
  expect: laiss_cms_

# --- 5. Environment variables ----------------------------------------------
- id: alchemy_env_prefix
  from: ALCHEMY_
  to: LAISS_CMS_
  mode: prefix
  kind: env
  expect: LAISS_CMS_

# --- 6. Last resort: bare lowercase word -----------------------------------
- id: alchemy_word
  from: alchemy
  to: laiss_cms
  mode: word
  kind: identifier
  expect: laiss_cms
